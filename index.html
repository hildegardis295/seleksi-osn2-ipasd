<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT OSN IPA - SDN 002 Sangatta Utara</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --hijau: #2e7d32; 
            --merah: #d32f2f; 
            --bg: #f4f7f6; 
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: #333;
        }

        /* Navigasi Timer */
        #timer { 
            position: sticky; 
            top: 0; 
            background: var(--merah); 
            color: white; 
            text-align: center; 
            padding: 12px; 
            font-weight: bold; 
            z-index: 1000; 
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: var(--shadow); 
            border-top: 10px solid var(--merah); 
        }

        .header { text-align: center; margin-bottom: 30px; }
        .logo { width: 100px; margin-bottom: 15px; border-radius: 10px; }
        h1 { color: var(--hijau); font-size: 20px; text-transform: uppercase; margin: 0; }
        h2 { font-size: 14px; color: #666; margin-top: 5px; }

        input[type="text"] { 
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; 
            border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; 
        }

        button { 
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; 
            border: none; font-weight: bold; cursor: pointer; font-size: 16px;
            transition: 0.3s;
        }

        .btn-start { background: var(--hijau); color: white; }
        .btn-start:hover { background: #1b5e20; }

        /* Style Soal */
        .question-box { display: none; animation: fadeIn 0.5s; }
        .active { display: block; }

        .badge { 
            display: inline-block; padding: 5px 10px; border-radius: 5px; 
            font-size: 11px; color: white; margin-bottom: 15px; font-weight: bold;
        }
        .pg { background: #1976d2; }
        .pgk { background: #f57c00; }
        .bs { background: #7b1fa2; }

        .soal-img { 
            max-width: 100%; border-radius: 10px; margin: 15px 0; 
            border: 1px solid #ddd; display: block; margin-left: auto; margin-right: auto;
        }

        .option { 
            display: flex; align-items: center; background: #f9f9f9; 
            padding: 15px; margin: 10px 0; border: 2px solid #eee; 
            border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .option:hover { border-color: var(--hijau); background: #e8f5e9; }
        .option input { margin-right: 15px; transform: scale(1.2); }

        /* Admin Panel */
        #adminPanel { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 2000; display: none; padding: 20px; 
            box-sizing: border-box; overflow-y: auto; 
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: var(--hijau); color: white; }

        .admin-trigger { 
            position: fixed; bottom: 10px; right: 10px; width: auto; 
            font-size: 10px; opacity: 0.3; background: none; color: #999;
        }

        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="timer" class="hidden">Sisa Waktu: 60:00</div>

<div id="startScreen" class="container">
    <div class="header">
        <img src="https://drive.google.com/uc?export=view&id=12dwz6quA4sh3dFIE_IxhiVpA1hilT07q" class="logo" alt="Logo Sekolah">
        <h1>OSN IPA SDN 002</h1>
        <h2>Seleksi Tingkat Sekolah - Sangatta Utara</h2>
    </div>
    <div style="margin-top: 20px;">
        <label>Nama Lengkap:</label>
        <input type="text" id="inputNama" placeholder="Masukkan nama sesuai absen">
        <label>Kelas:</label>
        <input type="text" id="inputKelas" placeholder="Contoh: 5A atau 6B">
        <button class="btn-start" id="btnStart">MULAI UJIAN</button>
    </div>
</div>

<div id="examScreen" class="container hidden">
    <div id="soalContainer"></div>
    <div style="display: flex; justify-content: space-between; margin-top: 25px; gap: 10px;">
        <button id="btnPrev" style="background:#757575; color:white; visibility:hidden;">KEMBALI</button>
        <button id="btnNext" style="background:var(--hijau); color:white;">BERIKUTNYA</button>
    </div>
</div>

<div id="resultScreen" class="container hidden" style="text-align: center;">
    <h1 style="color: var(--hijau)">Ujian Selesai!</h1>
    <p>Jawaban Anda telah berhasil dikirim ke server.</p>
    <hr>
    <div style="margin: 30px 0;">
        <p>Nama: <strong id="resNama"></strong></p>
        <p>Skor Anda:</p>
        <h1 style="font-size: 70px; color: var(--merah); margin: 10px 0;" id="resSkor">0</h1>
    </div>
    <button class="btn-start" onclick="location.reload()">KEMBALI KE BERANDA</button>
</div>

<button class="admin-trigger" id="adminTrigger">Admin Panel</button>
<div id="adminPanel">
    <div style="max-width: 800px; margin: auto;">
        <h2>Data Hasil Ujian Siswa</h2>
        <button id="btnDownload" style="background: #1976d2; color: white; width: auto; padding: 10px 20px;">Download Excel (.xlsx)</button>
        <button id="btnCloseAdmin" style="background: var(--merah); color: white; width: auto; padding: 10px 20px;">Tutup</button>
        <table>
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Nama</th>
                    <th>Kelas</th>
                    <th>Skor</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="adminTbody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    // FIREBASE SDK (Versi 10)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyDKPVXFSTN5EOL1_MFRACGWqsWNiOQ42Ug",
        authDomain: "seleksi-osn-ipa2.firebaseapp.com",
        projectId: "seleksi-osn-ipa2",
        databaseURL: "https://seleksi-osn-ipa2-default-rtdb.firebaseio.com",
        storageBucket: "seleksi-osn-ipa2.firebasestorage.app",
        messagingSenderId: "338193824874",
        appId: "1:338193824874:web:416b80f741b108348ede13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // DATA SOAL 1 - 45 (Lengkap sesuai PDF)
    const examData = [
        // 1-18: PILIHAN GANDA (PG)
        { q: "Jika populasi katak di sebuah sawah menurun drastis akibat perburuan manusia, dampak jangka panjang yang paling mungkin terjadi adalah...", img: "1lWVqJj45W1CqfSKWIzmG_PqrY7MZlz2b", type: "pg", options: ["A. Populasi belalang menurun karena ular meningkat", "B. Populasi rumput meningkat karena belalang berkurang", "C. Populasi ular menurun drastis sehingga elang terancam", "D. Populasi belalang meningkat drastis sehingga merusak padi"], ans: 3 },
        { q: "Upaya pelestarian penyu yang paling tepat agar mencapai usia dewasa adalah...", type: "pg", options: ["A. Melarang nelayan menangkap ikan", "B. Memindahkan telur ke penangkaran lalu melepas tukik bersamaan", "C. Memberi makan tukik di laut lepas", "D. Memagari seluruh pantai"], ans: 1 },
        { q: "Berdasarkan tabel ciri khusus tumbuhan, manakah hubungan yang benar?", img: "1s0yYlslVgqPB484Urzjo2cz2sOMUDZgC", type: "pg", options: ["A. Kaktus berdaun duri untuk mempercepat penguapan", "B. Teratai berdaun lebar untuk menyerap oksigen", "C. Kantong semar menghasilkan nektar licin untuk memerangkap serangga", "D. Kaktus duri sebagai tempat fotosintesis"], ans: 2 },
        { q: "Jika elastisitas kantong udara pada Alveolus rusak akibat asap rokok, gangguan yang terjadi adalah...", img: "1J4LflFPkOyjUF_cyuxtOlIZTho-YdfBR", type: "pg", options: ["A. Udara tidak bisa masuk hidung", "B. Penyaringan kuman terhenti", "C. Penyerapan oksigen tidak maksimal", "D. Napas menjadi lebih lambat"], ans: 2 },
        { q: "Tindakan yang paling tepat bagi remaja laki-laki yang mengalami mimpi basah adalah...", type: "pg", options: ["A. Mengurangi aktivitas fisik", "B. Menjaga kebersihan organ reproduksi secara mandiri", "C. Meminum obat hormonal", "D. Menghindari teman"], ans: 1 },
        { q: "Di gedung bioskop tidak terdengar gaung karena...", type: "pg", options: ["A. Bunyi merambat lambat", "B. Dinding dilapisi peredam (karpet/busa)", "C. Gedung sangat luas", "D. Suara terlalu keras"], ans: 1 },
        { q: "Jika benda digeser mendekati lampu senter, maka bayangan pada layar akan...", type: "pg", options: ["A. Mengecil dan tajam", "B. Membesar dan kabur", "C. Tetap", "D. Hilang"], ans: 1 },
        { q: "Sendi peluru pada bahu memiliki keunggulan berupa...", img: "1IQYa2odiREL7E5O2KqgnV4X-cPaE3lbB", type: "pg", options: ["A. Gerak satu arah", "B. Gerak ke segala arah sehingga fleksibel", "C. Menghindari gesekan", "D. Membatasi gerak"], ans: 1 },
        { q: "Tahapan siklus air yang terganggu akibat penebangan hutan adalah...", type: "pg", options: ["A. Evaporasi", "B. Kondensasi", "C. Infiltrasi (Penyerapan)", "D. Presipitasi"], ans: 2 },
        { q: "Pada elektromagnet, jika jumlah baterai ditambah, maka...", type: "pg", options: ["A. Paku menjadi panas", "B. Daya tarik magnet paku semakin kuat", "C. Kutub magnet bertukar", "D. Paku menolak logam"], ans: 1 },
        { q: "Gagang panci dari plastik memanfaatkan sifat benda yaitu...", type: "pg", options: ["A. Konduktor panas", "B. Isolator panas", "C. Mempercepat mendidih", "D. Mengubah energi"], ans: 1 },
        { q: "Air laut termasuk ke dalam jenis materi...", type: "pg", options: ["A. Zat tunggal", "B. Unsur", "C. Campuran homogen", "D. Campuran heterogen"], ans: 2 },
        { q: "Perubahan energi pada kincir air untuk listrik adalah...", type: "pg", options: ["A. Potensial ke Panas", "B. Kinetik ke Gerak lalu ke Listrik", "C. Kimia ke Listrik", "D. Listrik ke Gerak"], ans: 1 },
        { q: "Bumi berada di antara Matahari dan Bulan dalam satu garis lurus menyebabkan...", img: "1DTD0t0m4np6qCH_734d7_l6DzzhLd8yF", type: "pg", options: ["A. Gerhana Matahari", "B. Gerhana Bulan Total", "C. Bulan Sabit", "D. Gerhana Matahari Cincin"], ans: 1 },
        { q: "Alternatif pengganti pestisida kimia yang ramah lingkungan adalah...", type: "pg", options: ["A. Membakar lahan", "B. Predator alami (Biopestisida)", "C. Berhenti menanam", "D. Pestisida dosis tinggi"], ans: 1 },
        { q: "Bus direm mendadak penumpang terdorong ke depan. Ini bukti gaya dapat...", type: "pg", options: ["A. Ubah bentuk", "B. Ubah arah", "C. Hentikan gerak benda", "D. Gerakkan benda diam"], ans: 2 },
        { q: "Jika otot jantung kiri lemah, dampaknya adalah...", type: "pg", options: ["A. Tubuh mudah lelah karena kurang oksigen", "B. Darah tidak ke paru", "C. Darah berhenti diproduksi", "D. Ginjal rusak"], ans: 0 },
        { q: "Planet yang dijuluki 'Planet Merah' adalah...", type: "pg", options: ["A. Venus", "B. Mars", "C. Yupiter", "D. Saturnus"], ans: 1 },

        // 19-33: PG KOMPLEKS (PGK)
        { q: "Perkembangan primer pada remaja laki-laki adalah...", type: "pgk", options: ["A. Jakun tumbuh", "B. Mimpi basah", "C. Suara berat", "D. Dada bidang"], ans: 1 },
        { q: "Sendi engsel terdapat pada bagian tubuh...", type: "pgk", options: ["A. Siku dan Lutut", "B. Bahu", "C. Leher", "D. Pergelangan kaki"], ans: 0 },
        { q: "Pelangi membuktikan cahaya dapat...", type: "pgk", options: ["A. Merambat lurus", "B. Diuraikan (Dispersi)", "C. Dipantulkan", "D. Diserap"], ans: 1 },
        { q: "Tumbuhan yang berkembang biak dengan tunas adventif...", type: "pgk", options: ["A. Pisang", "B. Cocor Bebek", "C. Bambu", "D. Singkong"], ans: 1 },
        { q: "Fungsi akar napas pada bakau adalah...", type: "pgk", options: ["A. Simpan air", "B. Membantu pernapasan", "C. Fotosintesis", "D. Menarik serangga"], ans: 1 },
        { q: "Pada rangkaian seri, jika satu lampu mati maka...", type: "pgk", options: ["A. Tetap nyala", "B. Semua ikut mati", "C. Semakin terang", "D. Kabel terbakar"], ans: 1 },
        { q: "Benda Feromagnetik adalah benda yang...", type: "pgk", options: ["A. Tolak magnet", "B. Ditarik kuat oleh magnet", "C. Ditarik lemah", "D. Tidak bereaksi"], ans: 1 },
        { q: "Gas berubah menjadi padat disebut...", type: "pgk", options: ["A. Menyublim", "B. Mengkristal", "C. Mencair", "D. Menguap"], ans: 1 },
        { q: "Energi dari panas bumi disebut...", type: "pgk", options: ["A. Biomassa", "B. Geotermal", "C. Solar", "D. Nuklir"], ans: 1 },
        { q: "Waktu rotasi bumi adalah...", type: "pgk", options: ["A. 1 tahun", "B. 24 Jam", "C. 1 bulan", "D. 12 jam"], ans: 1 },
        { q: "Hubungan antar rantai makanan disebut...", type: "pgk", options: ["A. Ekosistem", "B. Jaring-jaring makanan", "C. Populasi", "D. Habitat"], ans: 1 },
        { q: "Warna merah darah disebabkan oleh...", type: "pgk", options: ["A. Plasma", "B. Hemoglobin", "C. Trombosit", "D. Leukosit"], ans: 1 },
        { q: "Contoh perubahan kimia adalah...", type: "pgk", options: ["A. Es mencair", "B. Kayu menjadi abu", "C. Gula larut", "D. Besi dipotong"], ans: 1 },
        { q: "Cara melestarikan air adalah...", type: "pgk", options: ["A. Tebang pohon", "B. Menanam pohon (Reboisasi)", "C. Buang sampah di sungai", "D. Semen seluruh tanah"], ans: 1 },
        { q: "Hewan yang bernapas dengan kulit adalah...", type: "pgk", options: ["A. Ikan", "B. Cacing tanah dan Katak", "C. Burung", "D. Belalang"], ans: 1 },

        // 34-45: BENAR SALAH (BS)
        { q: "Kupu-kupu mengalami metamorfosis sempurna karena melewati fase pupa.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 0 },
        { q: "Paku yang dililit kawat berarus listrik akan menjadi magnet permanen.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 1 },
        { q: "Matahari adalah pusat tata surya.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 0 },
        { q: "Sendok logam panas di air panas adalah contoh konveksi.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 1 },
        { q: "Emas murni dan garam dapur adalah zat tunggal.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 0 },
        { q: "Apel jatuh karena gaya magnet bumi.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 1 },
        { q: "Tumbuh kumis adalah ciri sekunder laki-laki.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 0 },
        { q: "Bakteri dan Jamur berperan sebagai produsen.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 1 },
        { q: "Bunyi dapat merambat di ruang hampa.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 1 },
        { q: "Osteoporosis dapat dicegah dengan kalsium.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 0 },
        { q: "Hujan asam menyuburkan tanah.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 1 },
        { q: "Pelestarian Komodo di habitatnya disebut In-situ.", type: "bs", options: ["Sesuai (Benar)", "Tidak Sesuai (Salah)"], ans: 0 }
    ];

    let currentQ = 0, userAns = [], timeLeft = 3600, timerInterval;

    // FUNGSI UTAMA
    document.getElementById('btnStart').onclick = () => {
        const nama = document.getElementById('inputNama').value;
        const kelas = document.getElementById('inputKelas').value;
        if(!nama || !kelas) return alert("Mohon isi Nama dan Kelas!");
        
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('examScreen').classList.remove('hidden');
        document.getElementById('timer').classList.remove('hidden');
        renderQuestions();
        startTimer();
    };

    function renderQuestions() {
        const container = document.getElementById('soalContainer');
        examData.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `question-box ${i === 0 ? 'active' : ''}`;
            div.id = `qbox-${i}`;
            const labelType = s.type === 'pg' ? 'Pilihan Ganda' : s.type === 'pgk' ? 'PG Kompleks' : 'Benar / Salah';
            
            div.innerHTML = `
                <span class="badge ${s.type}">${labelType}</span>
                <p style="font-weight:bold; margin-bottom:10px;">Soal Nomor ${i+1}</p>
                <p style="line-height:1.5;">${s.q}</p>
                ${s.img ? `<img src="https://drive.google.com/uc?export=view&id=${s.img}" class="soal-img">` : ''}
                <div style="margin-top:20px;">
                    ${s.options.map((opt, idx) => `
                        <label class="option">
                            <input type="radio" name="soal${i}" onclick="window.saveJawaban(${i}, ${idx})">
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.saveJawaban = (indexSoal, pilihan) => {
        userAns[indexSoal] = pilihan;
    };

    document.getElementById('btnNext').onclick = () => {
        if(currentQ < examData.length - 1) {
            document.getElementById(`qbox-${currentQ}`).classList.remove('active');
            currentQ++;
            document.getElementById(`qbox-${currentQ}`).classList.add('active');
            document.getElementById('btnPrev').style.visibility = 'visible';
            if(currentQ === examData.length - 1) document.getElementById('btnNext').innerText = "KIRIM JAWABAN";
            window.scrollTo(0,0);
        } else {
            submitUjian();
        }
    };

    document.getElementById('btnPrev').onclick = () => {
        if(currentQ > 0) {
            document.getElementById(`qbox-${currentQ}`).classList.remove('active');
            currentQ--;
            document.getElementById(`qbox-${currentQ}`).classList.add('active');
            document.getElementById('btnNext').innerText = "BERIKUTNYA";
            if(currentQ === 0) document.getElementById('btnPrev').style.visibility = 'hidden';
            window.scrollTo(0,0);
        }
    };

    function submitUjian() {
        if(!confirm("Apakah Anda yakin ingin mengakhiri ujian?")) return;
        clearInterval(timerInterval);

        let skorBenar = 0;
        examData.forEach((s, i) => {
            if(userAns[i] === s.ans) skorBenar++;
        });
        const nilaiAkhir = Math.round((skorBenar / examData.length) * 100);

        const dataSiswa = {
            nama: document.getElementById('inputNama').value,
            kelas: document.getElementById('inputKelas').value,
            skor: nilaiAkhir,
            status: nilaiAkhir >= 75 ? "LULUS" : "TIDAK LULUS",
            waktu: new Date().toLocaleString('id-ID')
        };

        // Simpan ke Firebase
        push(ref(db, 'hasil_osn'), dataSiswa).then(() => {
            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('timer').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('resNama').innerText = dataSiswa.nama;
            document.getElementById('resSkor').innerText = nilaiAkhir;
        }).catch(err => alert("Gagal mengirim data. Periksa koneksi!"));
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `Sisa Waktu: ${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft <= 0) submitUjian();
        }, 1000);
    }

    // LOGIKA ADMIN
    document.getElementById('adminTrigger').onclick = () => {
        const pass = prompt("Masukkan Password Admin:");
        if(pass === "1995") {
            document.getElementById('adminPanel').style.display = 'block';
            onValue(ref(db, 'hasil_osn'), (snapshot) => {
                const tbody = document.getElementById('adminTbody');
                tbody.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.values(data).forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${item.waktu}</td>
                                <td>${item.nama}</td>
                                <td>${item.kelas}</td>
                                <td>${item.skor}</td>
                                <td style="color:${item.status === 'LULUS' ? 'green' : 'red'}"><b>${item.status}</b></td>
                            </tr>
                        `;
                    });
                }
            });
        } else if(pass !== null) {
            alert("Password Salah!");
        }
    };

    document.getElementById('btnCloseAdmin').onclick = () => document.getElementById('adminPanel').style.display = 'none';

    document.getElementById('btnDownload').onclick = async () => {
        const snap = await get(ref(db, 'hasil_osn'));
        const rawData = snap.val();
        if(!rawData) return alert("Belum ada data.");
        
        const worksheet = XLSX.utils.json_to_sheet(Object.values(rawData));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil OSN IPA");
